
name: Build Sakura Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ARCHIVE=$(find . -maxdepth 1 -name 'SakuraManagerAndroid_Source*.zip' -print -quit)
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d .

      - name: Set Java and Kotlin target to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SakuraManagerAndroid/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }''',
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p SakuraManagerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-Manager-APK
          path: SakuraManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
